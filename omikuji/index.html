    --vermilion:#a8362a;--vermilion-deep:#8f2c22;--gold:#9a7d3c;--gold-soft:#b9a05e;

  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--serif);color:var(--ink);background-color:var(--paper);

  .wrap{max-width:720px;margin:0 auto;padding:0 clamp(1.4rem,4vw,3rem);}

  /* スマホ時のヘッダー配置（全ページ統一） */

    .topbar .inner,.topbar .wrap{min-height:56px;flex-wrap:wrap;padding-top:.6rem;padding-bottom:.6rem;gap:.3rem 1rem;}
    .wordmark{letter-spacing:.3em;}
    .topnav{gap:.7rem 1.1rem;font-size:.7rem;letter-spacing:.16em;justify-content:flex-end;}
  }
  /* 見出しの書体＝トップと揃える（2026-09-17） */
  h2{font-family:'Zen Antique Soft','Shippori Mincho',serif!important;font-weight:400!important;}

  /* おみくじ */
  .mk{margin:1rem 0 2rem;text-align:center;}
  .tsutsu{width:92px;height:150px;margin:2rem auto 1.6rem;position:relative;}
  .tsutsu .body{position:absolute;inset:18px 0 0 0;background:linear-gradient(90deg,#7a2a20,#a8362a 45%,#8f2c22);border-radius:6px;box-shadow:inset 0 0 0 2px rgba(154,125,60,.55);}
  .tsutsu .body::after{content:"御\A神\A籤";white-space:pre;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#efe3c6;font-size:1.05rem;line-height:1;letter-spacing:0;}
  .tsutsu .lid{position:absolute;left:-4px;right:-4px;top:8px;height:16px;background:var(--gold);border-radius:4px;}
  .tsutsu .bou{position:absolute;left:50%;bottom:calc(100% - 20px);width:8px;height:0;margin-left:-4px;background:#e9dcbc;border:1px solid var(--gold);border-radius:2px;transition:height .45s ease .1s;}
  .tsutsu.furu{animation:furu 1.35s ease-in-out;}
  .tsutsu.deta .bou{height:56px;}
  @keyframes furu{0%,100%{transform:rotate(0)}15%{transform:rotate(-16deg)}35%{transform:rotate(14deg)}55%{transform:rotate(-11deg)}75%{transform:rotate(8deg)}}
  .mk-btn{font-family:var(--serif);font-size:1rem;letter-spacing:.3em;background:var(--vermilion);color:#fff;border:0;border-radius:6px;padding:.75rem 2.4rem;cursor:pointer;}
  .mk-btn:hover{background:var(--vermilion-deep);}
  .mk-btn[disabled]{opacity:.5;cursor:default;}
  .mk-gate{max-width:420px;margin:0 auto;}
  .mk-gate label{display:block;font-size:.86rem;letter-spacing:.12em;color:var(--ink-soft);margin-bottom:.6rem;}
  .mk-gate input{font-family:var(--serif);font-size:1.05rem;letter-spacing:.12em;text-align:center;width:100%;padding:.65rem .8rem;border:1px solid var(--line);border-radius:6px;background:var(--paper-card);color:var(--ink);margin-bottom:1rem;}
  .mk-err{min-height:1.6em;font-size:.82rem;color:var(--vermilion-deep);letter-spacing:.06em;margin-top:.6rem;}
  .mk-line{margin-top:2rem;padding-top:1.5rem;border-top:1px dotted var(--line);}
  .mk-line p{font-size:.86rem;line-height:1.17;color:var(--ink-soft);letter-spacing:.05em;margin:0 0 1rem;}
  .tg-line-btn{display:inline-flex;align-items:center;gap:.6rem;background:#06C755;color:#fff;text-decoration:none;padding:.72rem 1.95rem;border-radius:6px;font-size:.82rem;letter-spacing:.16em;}
  .fuda{max-width:360px;margin:0 auto 1.6rem;background:var(--paper-card);border:1px solid var(--line);border-top:4px solid var(--vermilion);padding:1.8rem 1.6rem 1.4rem;box-shadow:0 6px 18px rgba(60,40,20,.10);opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s;}
  .fuda.miseru{opacity:1;transform:none;}
  .fuda .f-mid{font-family:'Zen Antique Soft','Shippori Mincho',serif;font-size:1.7rem;letter-spacing:.2em;color:var(--vermilion-deep);margin-bottom:1rem;}
  .fuda .f-mid:has(+ .f-yomi:not([hidden])){margin-bottom:.3rem;}
  .fuda .f-yomi{font-size:.8rem;letter-spacing:.12em;color:var(--muted);margin-bottom:1rem;word-break:break-all;}
  .fuda .f-hon{font-size:1.02rem;line-height:1.29;letter-spacing:.05em;text-align:left;white-space:pre-line;}
  .fuda .f-soe{margin-top:1.1rem;font-size:.78rem;letter-spacing:.1em;color:var(--muted);text-align:right;}
  .mk-note{font-size:.78rem;color:var(--muted);letter-spacing:.06em;margin-top:.8rem;}
  [hidden]{display:none!important;}

<script src="fuda.js"></script>
<script>
(function(){
  var D=window.NAKATOKO_OMIKUJI||{fuda:[]};
  var KEY='omikuji_ai', DAY='omikuji_day';
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
  function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
  function norm(s){return (s||'').normalize('NFKC').replace(/\s+/g,'');}
  function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');});}
  var gate=document.getElementById('gate'),hiku=document.getElementById('hiku'),err=document.getElementById('err');
  function open(){gate.hidden=true;hiku.hidden=false;}
  if(ls(KEY)===D.aikotoba) open();
  gate.addEventListener('submit',function(e){
    e.preventDefault();
    var v=norm(document.getElementById('ai').value);
    if(!v){err.textContent='合言葉をお入れください。';return;}
    sha(v).then(function(h){
      if(h===D.aikotoba){ls(KEY,h);err.textContent='';open();}
      else err.textContent='合言葉が違うようです。LINEのメッセージをお確かめください。';
    });
  });
  var t=document.getElementById('tsutsu'),btn=document.getElementById('btn'),f=document.getElementById('fuda'),note=document.getElementById('note');
  function show(i){
    var x=D.fuda[i]||{};
    [['fMid','midashi'],['fYomi','yomi'],['fHon','honbun'],['fSoe','soe']].forEach(function(p){var el=document.getElementById(p[0]);el.textContent=x[p[1]]||'';el.hidden=!x[p[1]];});
    f.hidden=false;requestAnimationFrame(function(){requestAnimationFrame(function(){f.classList.add('miseru');});});
  }
  btn.addEventListener('click',function(){
    if(!D.fuda.length) return;
    var kept=null;
    if(D.ichinichi===1){var s=(ls(DAY)||'').split('|');if(s[0]===today()&&D.fuda[+s[1]])kept=+s[1];}
    btn.disabled=true;f.classList.remove('miseru');t.classList.remove('deta');
    void t.offsetWidth;t.classList.add('furu');
    setTimeout(function(){
      t.classList.remove('furu');t.classList.add('deta');
      var i=kept!==null?kept:Math.floor(Math.random()*D.fuda.length);
      if(D.ichinichi===1&&kept===null) ls(DAY,today()+'|'+i);
      show(i);
      if(D.ichinichi===1){note.hidden=false;note.textContent='一日一回の縁だめし！';btn.hidden=true;}
      else{btn.disabled=false;btn.textContent='もう一度引く';}
    },1400);
  });
})();
</script>
